[package]
name = "backend-daemon"
version = "0.1.0"
edition = "2021"
description = "Universal Controller hub daemon (Tokio async runtime)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
# default-features off: the default pulls in a full TLS stack (rustls,
# ring, webpki) via the "use-rustls" feature, needed for mqtts:// brokers.
# Not needed against the plain local test broker this is verified against
# (see mqtt.rs), and ring's C build step is unnecessary cross-compilation
# risk to take on for something unused -- add "use-rustls" back explicitly
# if/when a real broker connection actually needs TLS.
rumqttc = { version = "0.24", default-features = false }
