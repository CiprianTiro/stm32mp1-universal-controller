[package]
name = "backend-daemon"
version = "0.1.0"
edition = "2021"
description = "Universal Controller hub daemon (Tokio async runtime)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"
# Built with the rustup toolchain in the yocto-builder container (the same
# one as ui_layer), NOT Poky's own Rust 1.75 any more (issue #37): stuck on
# 1.75, security fixes that need a newer compiler (e.g. time >= 0.3.47,
# Rust 1.88) could not be taken. See backend-daemon.bb.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "io-util", "process"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Checks the hub's time zone setting (settings.rs, issue #39) against the
# IANA time zone database compiled into this crate -- the board has no
# /usr/share/zoneinfo, and the check shouldn't depend on it. Only the
# names are needed: no default features (no serde, no case-insensitive
# lookup).
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# Dates and times in the hub's time zone for automations (issue #47):
# already in the build through chrono-tz; no default features (no system
# time zone lookup -- the time zone is the hub's setting).
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.7", features = ["ws"] }
# MQTT over TLS with a client certificate (mutual TLS), as AWS IoT Core
# requires -- see src/mqtt.rs. rustls is a pure-Rust TLS stack; its crypto
# comes from the `ring` crate, which compiles some C/assembly for ARM
# during the Yocto build. "use-rustls-no-provider" instead of "use-rustls":
# the latter would also build aws-lc-rs, a second, large C crypto library
# (CMake build) -- ring is chosen below, through tokio-rustls.
# This is a PATCHED copy (see [patch.crates-io] at the end, issue #37).
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
# Issue #35 -- the LAN connection over TLS (wss://) with pairing.
# rcgen creates the hub's own TLS certificate on first start (there is no
# `openssl` command on the board); with the "ring" backend it uses the same
# crypto library as everything else below.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# tokio-rustls = TLS for the WebSocket server (and, through rumqttc, for
# MQTT); "ring" picks ring as rustls's crypto (see above). Certificate/key
# files are read with rustls's own PEM reader (rustls::pki_types::pem).
# ring = random numbers + SHA-256, base64 = the client tokens as text.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
ring = "0.17"
base64 = "0.22"
# Already in the build through axum: serving axum's router over our own TLS
# connections (axum::serve only does plain TCP). The exact features axum
# already enables, so nothing new is compiled.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
# The `Service` trait axum's router implements (already in the build).
tower-service = "0.3"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
spake2 = "0.4.0"
# Big-number maths for SRP6a (issue #42, adapters/esp_prov/srp.rs: WiFi setup
# of IR blasters over Bluetooth with Espressif's protocol). Already in the
# build as a dependency of another crate; named here since we use it directly.
num-bigint = "0.4"
dbus = { version = "0.9", features = ["vendored"] }
mdns-sd = "0.21"
# Issue #40, the adapters' toolkit (adapters/net.rs): talking to devices.
# All already in the build through axum/hyper -- only hyper's small
# "client" half above is new code. HTTP: hyper's client + http-body-util
# (read a whole reply body, with a size limit) + bytes (the body type).
# WebSocket client: the same tokio-tungstenite axum's server uses (plain
# ws:// only for now; wss:// for the LG TV comes with its adapter).
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Issue #74: vendor protocols. Roborock's local protocol and broadcasts use
# AES-128 (ECB) with keys derived by MD5; miIO uses AES-128-CBC. Not for
# our own security (ring does that) -- only to speak the devices' language.
aes = "0.8"
md-5 = "0.10"
# Issue #74: a Roborock map arrives gzip-compressed (pure Rust inflate).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Issue #37: rumqttc 0.25.1 (its latest release) still depends on
# rustls-webpki 0.102, which has known vulnerabilities. This local copy
# differs from the published crate in that one version number only -- see
# patched/rumqttc/PATCHED.md, including when to remove it.
[patch.crates-io]
rumqttc = { path = "patched/rumqttc" }
