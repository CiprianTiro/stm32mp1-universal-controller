[package]
name = "backend-daemon"
version = "0.1.0"
edition = "2021"
description = "Universal Controller hub daemon (Tokio async runtime)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"
# This crate is built by Yocto's own Rust (scarthgap ships 1.75), not the
# newer rustup toolchain on the dev PC. Declaring it here lets cargo's
# MSRV-aware resolver pick dependency versions that still support 1.75
# when Cargo.lock is updated (run with
# CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback), instead of the newest
# versions, which may need a newer compiler and only fail inside bitbake.
rust-version = "1.75"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "io-util"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
# "use-rustls": MQTT over TLS with a client certificate (mutual TLS), as
# AWS IoT Core requires -- see src/mqtt.rs. rustls is a pure-Rust TLS stack;
# its crypto comes from the `ring` crate, which compiles some C/assembly
# for ARM during the Yocto build (the cargo class provides the cross C
# compiler for that).
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
