[package]
name = "backend-daemon"
version = "0.1.0"
edition = "2021"
description = "Universal Controller hub daemon (Tokio async runtime)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"
# This crate is built by Yocto's own Rust (scarthgap ships 1.75), not the
# newer rustup toolchain on the dev PC. Declaring it here lets cargo's
# MSRV-aware resolver pick dependency versions that still support 1.75
# when Cargo.lock is updated (run with
# CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback), instead of the newest
# versions, which may need a newer compiler and only fail inside bitbake.
rust-version = "1.75"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "io-util"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
# "use-rustls": MQTT over TLS with a client certificate (mutual TLS), as
# AWS IoT Core requires -- see src/mqtt.rs. rustls is a pure-Rust TLS stack;
# its crypto comes from the `ring` crate, which compiles some C/assembly
# for ARM during the Yocto build (the cargo class provides the cross C
# compiler for that).
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
# Issue #35 -- the LAN connection over TLS (wss://) with pairing.
# rcgen creates the hub's own TLS certificate on first start (there is no
# `openssl` command on the board); with the "ring" backend it uses the same
# crypto library as everything else below. It's the only one of these that
# added crates to the build (rcgen, time, yasna, pem + small helpers).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Already in the build through rumqttc (same versions and features), now
# used directly: tokio-rustls = TLS for the WebSocket server, rustls-pemfile
# reads the certificate files, ring = random numbers + SHA-256, base64 =
# the client tokens as text.
tokio-rustls = "0.25"
rustls-pemfile = "2"
ring = "0.17"
base64 = "0.22"
# Already in the build through axum: serving axum's router over our own TLS
# connections (axum::serve only does plain TCP). The exact features axum
# already enables, so nothing new is compiled.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
# The `Service` trait axum's router implements (already in the build).
tower-service = "0.3"
