[package]
name = "ui-layer"
version = "0.1.0"
edition = "2021"
description = "Universal Controller touchscreen UI (Slint, direct-to-framebuffer)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
# default-features off, only "std" + "renderer-software" on: the other
# Slint backend, "backend-linuxkms", wants a working DRM/KMS driver
# (/dev/dri/cardN) to talk to -- this board has no confirmed-working GPU
# driver, only the plain /dev/fb0 framebuffer device, so that backend isn't
# an option here. "renderer-software" is Slint's CPU-only rasterizer; it
# doesn't come with any window-system integration of its own, which is why
# this crate also owns fb_platform.rs (writes the rendered pixels to
# /dev/fb0 by hand) and touch_input.rs (reads touch events from evdev by
# hand) -- neither of those exists for free with this renderer.
# "compat-1-18": Slint's own required opt-in acknowledging this project
# is pinned against its 1.18 API and accepts the small behavior changes a
# future minor version might otherwise silently introduce -- required by
# the crate itself, not something optional.
slint = { version = "1", default-features = false, features = ["std", "renderer-software", "compat-1-18"] }

# Not used directly by this crate's code -- listed ONLY to switch on
# fontique's "fontconfig-dlopen" feature. fontique is Slint's system-font
# discovery library (pulled in unconditionally by Slint's font stack, no
# way to turn it off) and on Linux it talks to libfontconfig. By default it
# LINKS libfontconfig at build time, which needs fontconfig's headers and a
# cross-compile pkg-config setup we don't have. With this feature it instead
# dlopen()s libfontconfig.so at runtime, and if the library isn't there it
# just reports "no system fonts" -- harmless, since ui/app.slint embeds its
# own font and never needs system fonts.
#
# Why a Cargo feature and not the RUST_FONTCONFIG_DLOPEN=1 env var: that env
# var only flips yeslogic-fontconfig-sys into dlopen mode, while fontique's
# own code still calls the link-time API -- the two crates disagree and
# fontique fails to compile. The feature below switches BOTH crates at once
# (fontique's feature forwards to fontconfig-sys's "dlopen" feature).
# Cargo merges features across the whole dependency graph, so enabling it
# here applies to the same fontique copy Slint uses -- the version must stay
# compatible with whatever Slint depends on (0.11 for Slint 1.18).
# (Slint's internal i-slint-common crate has an equivalent
# "fontconfig-dlopen" feature, but the public `slint` crate doesn't expose it.)
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

# Talks to backend_daemon's WebSocket server (ws.rs) over the same local
# IPC path any other client (a phone, a browser) would use -- see
# ARCHITECTURE.md's "Local IPC" section for why this isn't a separate,
# custom protocol. tungstenite (not tokio-tungstenite): this crate doesn't
# run a Tokio runtime at all -- the GUI's own event loop (in main.rs) is a
# plain blocking loop reading the framebuffer/evdev/websocket in turn, so a
# synchronous WebSocket client fits it better than an async one would.
tungstenite = "0.24"

# JSON (de)serialization for the WebSocket messages -- same crates
# backend_daemon uses for the same reason: matching its ClientRequest/
# ServerResponse shapes exactly (see src/ws_client.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reads raw touch events from the kernel's evdev input device (see
# src/touch_input.rs) -- the DK2's capacitive touch panel shows up as an
# ordinary Linux input device, and this is the standard Rust crate for
# reading those directly, the same way `libinput` would if a full desktop
# input stack were in use here (it isn't -- see backend-linuxkms note above).
evdev = "0.13"

# Opens /dev/fb0, sets its pixel format, and reads its visible size via the
# same ioctls `fbset` uses -- see src/fb_platform.rs. (The pixel memory
# itself is mapped with memmap2 below, not by this crate.)
linuxfb = "0.3"

# Maps /dev/fb0's pixel memory (see src/fb_platform.rs). linuxfb can map it
# too, but sizes the mapping assuming rows have no padding, which is wrong
# on this board (rows are padded from 960 to 1024 bytes). Already in the
# dependency tree via Slint's font code, so this adds no new crate.
memmap2 = "0.9"
# Issue #35: draws the pairing QR code on the hub's screen. Pure Rust, no
# dependencies of its own.
qrcodegen = "1.8"

[build-dependencies]
# Used by build.rs to compile ui/app.slint -- see that file's own comment.
slint-build = "1"
