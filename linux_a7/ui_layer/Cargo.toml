[package]
name = "ui-layer"
version = "0.1.0"
edition = "2021"
description = "Universal Controller hub UI (Slint on DRM/KMS: touchscreen or HDMI monitor)"
repository = "https://github.com/CiprianTiro/stm32mp1-universal-controller"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
# default-features off, then exactly what's needed:
#   - "backend-linuxkms" (issue #38): Slint drives the display itself
#     through DRM/KMS (/dev/dri/card0), the kernel's modern display
#     interface -- no X11/Wayland. Until #38 the UI drew into the legacy
#     framebuffer /dev/fb0 by hand (fb_platform.rs), but the kernel ties
#     /dev/fb0 to ONE output at boot (the touchscreen), so the UI could
#     never reach the HDMI monitor. With KMS it picks the output itself
#     (see src/display.rs).
#   - "backend-linuxkms-noseat": the same backend reading ALL input itself
#     through libinput -- the touch panel, and a USB mouse and keyboard
#     for when the UI is on a monitor (#38). Replaces the hand-written
#     touch_input.rs (evdev) of #14. "noseat": the input devices are
#     opened directly (user hubui is in group "input"), without the
#     libseat/logind session machinery a desktop would use.
#   - "unstable-libinput-09": lets main.rs see each libinput event before
#     Slint does, to draw the mouse pointer the software renderer leaves
#     out (src/pointer.rs). "Unstable": Slint may change it in a later
#     minor version -- we're pinned to 1.18 anyway (compat-1-18).
#   - "renderer-software": Slint's CPU-only rasterizer, as before. The
#     KMS backend puts its pixels on screen through plain DRM "dumb"
#     buffers, so no GPU driver or library is needed.
# "compat-1-18": Slint's own required opt-in acknowledging this project
# is pinned against its 1.18 API and accepts the small behavior changes a
# future minor version might otherwise silently introduce -- required by
# the crate itself, not something optional.
slint = { version = "1", default-features = false, features = ["std", "backend-linuxkms", "backend-linuxkms-noseat", "unstable-libinput-09", "renderer-software", "compat-1-18"] }

# Not used directly by this crate's code -- listed ONLY to switch on
# fontique's "fontconfig-dlopen" feature. fontique is Slint's system-font
# discovery library (pulled in unconditionally by Slint's font stack, no
# way to turn it off) and on Linux it talks to libfontconfig. By default it
# LINKS libfontconfig at build time, which needs fontconfig's headers and a
# cross-compile pkg-config setup we don't have. With this feature it instead
# dlopen()s libfontconfig.so at runtime, and if the library isn't there it
# just reports "no system fonts" -- harmless, since ui/app.slint embeds its
# own font and never needs system fonts.
#
# Why a Cargo feature and not the RUST_FONTCONFIG_DLOPEN=1 env var: that env
# var only flips yeslogic-fontconfig-sys into dlopen mode, while fontique's
# own code still calls the link-time API -- the two crates disagree and
# fontique fails to compile. The feature below switches BOTH crates at once
# (fontique's feature forwards to fontconfig-sys's "dlopen" feature).
# Cargo merges features across the whole dependency graph, so enabling it
# here applies to the same fontique copy Slint uses -- the version must stay
# compatible with whatever Slint depends on (0.11 for Slint 1.18).
# (Slint's internal i-slint-common crate has an equivalent
# "fontconfig-dlopen" feature, but the public `slint` crate doesn't expose it.)
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

# Talks to backend_daemon's WebSocket server (ws.rs) over the same local
# IPC path any other client (a phone, a browser) would use -- see
# ARCHITECTURE.md's "Local IPC" section for why this isn't a separate,
# custom protocol. tungstenite (not tokio-tungstenite): this crate doesn't
# run a Tokio runtime at all -- the GUI's own event loop (in main.rs) is a
# Slint event loop with a timer that polls the websocket's updates (see
# main.rs), so a synchronous WebSocket client on its own thread fits it
# better than an async one would.
tungstenite = "0.24"

# JSON (de)serialization for the WebSocket messages -- same crates
# backend_daemon uses for the same reason: matching its ClientRequest/
# ServerResponse shapes exactly (see src/ws_client.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The hub's local time (issue #39, src/zones.rs): the clock runs on UTC,
# the time zone is a hub setting. chrono-tz carries the time zone database
# compiled in (the board has no /usr/share/zoneinfo). No default features:
# only what's used.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

# The libinput event type the pointer hook receives (src/pointer.rs). The
# same crate and version Slint's libinput support uses, so nothing new.
input = "0.10"

# Lists the display outputs (touchscreen, HDMI) and asks the monitor which
# modes it supports, before Slint starts -- see src/display.rs. The same
# crate (and version) Slint's KMS backend uses, so it adds nothing new to
# the build. Pure Rust: talks to the kernel's ioctls directly, no libdrm.
drm = "0.14"

# Issue #35: draws the pairing QR code on the hub's screen. Pure Rust, no
# dependencies of its own.
qrcodegen = "1.8"

[build-dependencies]
# Used by build.rs to compile ui/app.slint -- see that file's own comment.
slint-build = "1"
# build.rs reads ui/tokens.json (the text sizes to pre-render, issue #39).
serde_json = "1"
