# Drop-in for wpa_supplicant@wlan0.service (issue #61): the stock unit reads
# /etc/wpa_supplicant/wpa_supplicant-wlan0.conf; ours is on userfs (see
# hub-wifi-init.sh for why).
[Unit]
# /usr/local must be mounted first, or the config would be looked for (and
# created) on the rootfs underneath the mount point. Wants=, not Requires=:
# same reasoning as backend-daemon.service -- a storage problem must not
# take anything else down.
Wants=usr-local.mount
After=usr-local.mount

[Service]
# Every file wpa_supplicant creates is readable by root only. This matters
# for SAVE_CONFIG: it writes the config (with the WiFi password) to a new
# .tmp file and renames it into place, so the new file gets the service's
# umask -- with the default 022 that was world-readable (-rw-r--r--),
# found on the DK2 right after the first save.
UMask=0077
ExecStartPre=/usr/libexec/hub-wifi-init
# The empty ExecStart= first clears the stock unit's command; a drop-in can
# only replace a command, not edit it. -D nl80211: the standard Linux WiFi
# interface (brcmfmac supports it).
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c /usr/local/etc/universal-controller/wifi/wpa_supplicant.conf -i wlan0 -D nl80211
Restart=on-failure
RestartSec=5
