# The hub's local MQTT broker (issue #72). backend-daemon (broker.rs) owns
# the files in /usr/local/etc/universal-controller/broker: who may log in
# (passwd: hashed passwords) and which topics each may use (acl).

# One set of logins and rules for both listeners; nobody without a login.
per_listener_settings false
allow_anonymous false
password_file /usr/local/etc/universal-controller/broker/passwd
acl_file /usr/local/etc/universal-controller/broker/acl

# Nothing kept across restarts: devices send their state again anyway,
# and it would cost flash writes.
persistence false

# To the journal (stderr), the important things only, plus who connects.
log_dest stderr
# ...and as MQTT messages on $SYS/broker/log/..., which only the hub may
# read: a device knocking without a valid login shows up there, and the
# hub offers it as "new device waiting" (broker.rs, issue #72).
log_dest topic
log_type error
log_type warning
log_type notice
connection_messages true

# Plain MQTT: WLED and normal Tasmota builds can't do TLS. LAN only (the
# firewall), and every device has its own password.
listener 1883

# MQTT over TLS, for devices that can (ESPHome): the hub's own certificate
# (the same one the LAN API uses, tls.rs), copied here by backend-daemon.
listener 8883
certfile /usr/local/etc/universal-controller/broker/server.crt
keyfile /usr/local/etc/universal-controller/broker/server.key
