# =============================================================================
# Custom Layer Configuration for Universal Controller Target Platform
# Release Compatibility: Scarthgap (v5.0 LTS)
# =============================================================================

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES parsing matrix
# Includes explicit deep nesting support (**) for structured software trees
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/**/*.bb \
            ${LAYERDIR}/recipes-*/**/*.bbappend"

BBFILE_COLLECTIONS += "meta-universal-controller"
BBFILE_PATTERN_meta-universal-controller = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-universal-controller = "6"

# Core dependency layer tracking
LAYERDEPENDS_meta-universal-controller = "core"

# Enforce explicit compatibility restriction with the active LTS release branch
LAYERSERIES_COMPAT_meta-universal-controller = "scarthgap"