# Installed by the resolved-public-dns recipe (meta-universal-controller).
#
# Global DNS servers, used IN ADDITION to the ones the router hands out via
# DHCP. systemd-resolved sends each lookup to both and returns the first
# SUCCESSFUL answer, so one bad upstream can't break name resolution.
#
# Why: on 2026-09-23 the ISP's DNS (via the router) kept answering "no such
# name" for a freshly created AWS IoT endpoint, so the hub couldn't reach the
# cloud, while Cloudflare/Google resolved it fine (see wiki: Cloud-MQTT).
#
# Note: FallbackDNS= would NOT fix that -- it is only used when no other DNS
# server is known at all, and DHCP always provides some.
[Resolve]
DNS=1.1.1.1 8.8.8.8 2606:4700:4700::1111 2001:4860:4860::8888
