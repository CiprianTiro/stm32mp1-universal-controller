# Kernel settings that make the hub a harder target (issue #37). Applied at
# every boot by systemd-sysctl. Values measured on the DK2 before this file
# are noted where they change something.
#
# A "-" in front: the setting may not exist yet when this is applied (IPv6
# is a module on this kernel, loaded a moment later) -- skip it quietly
# then instead of failing. systemd applies the per-interface settings again
# when each interface appears, and the "default" ones are copied to every
# interface created later.

# --- What the kernel reveals ------------------------------------------
# Kernel memory addresses hidden, even from root's programs (was 0): they
# are the first thing an exploit needs.
kernel.kptr_restrict = 2
# The kernel log (dmesg) only for root (was 0: anyone).
kernel.dmesg_restrict = 1
# The magic SysRq key combinations: off (was 16, "sync"). The hub has no
# keyboard; nothing should be able to trigger them.
kernel.sysrq = 0

# --- Network -----------------------------------------------------------
# ICMP "redirect" messages tell a machine to send traffic through another
# router -- a classic trick to put an attacker in the middle. A hub on a
# home network never needs them. Don't accept them (was 1) and, as it
# isn't a router, don't send them either (was 1).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
-net.ipv6.conf.all.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# No "source routed" packets (the sender dictating the route).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
-net.ipv6.conf.all.accept_source_route = 0
-net.ipv6.conf.default.accept_source_route = 0
# Don't answer pings sent to the whole network (a way to flood someone
# with answers from every device at once).
net.ipv4.icmp_echo_ignore_broadcasts = 1
# SYN cookies: keeps the hub reachable during a flood of half-opened
# connections (already 1, stated here so it stays that way).
net.ipv4.tcp_syncookies = 1
# NOT set: rp_filter (strict "reverse path" checking). With the cable and
# WiFi on the same home network (#61), replies can legitimately arrive on
# the "other" interface, and strict mode would drop them. The firewall
# already drops everything unexpected.

# --- Files ---------------------------------------------------------------
# Programs that switch users (setuid) never leave memory dumps behind.
fs.suid_dumpable = 0
# Links/files in world-writable folders like /tmp can't be used to trick
# a privileged program into opening something else (1 was the default for
# the last one; 2 also covers group-writable folders).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 2
