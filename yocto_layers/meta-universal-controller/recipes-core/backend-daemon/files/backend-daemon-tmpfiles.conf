# backend_daemon's folders on the userfs partition (/usr/local), owned by
# its user "hubd" (issue #37). Applied by backend-daemon.service before
# every start (ExecStartPre=), not only at boot: the MQTT identity is copied
# onto the board as root (provisioning over SSH), and a board updated from
# an older image has everything owned by root -- either way the daemon
# would then be locked out of its own files.
#
# d = create the folder if missing, and fix its mode and owner if not.
# Z = set the owner of everything inside, recursively. "-" as mode keeps
#     each file's own mode (keys stay 600, the certificate 644). Unlike a
#     plain `chown -R`, Z never follows symbolic links, so a link planted
#     in there can't make it change files elsewhere.
#
# The WiFi folder (wifi/) is NOT listed: it stays root's. It holds the WiFi
# passwords, and wpa_supplicant (root) is the only one using it.
#
# The parent folders (/usr/local/var, /usr/local/var/lib) are listed too:
# hubd must be able to pass THROUGH them to reach its own folder. On the
# DK2 they had been created as root-only (0700) back when the daemon ran
# as root -- so hubd was locked out even though it owned the folder
# itself, and started with no devices and no paired clients. 0755 lets
# every user pass through and list them, which is harmless: the folders
# that matter inside are 0700 and belong to hubd.
#
# Type  Path                                            Mode  User  Group  Age
d       /usr/local/var                                  0755  root  root   -
d       /usr/local/var/lib                              0755  root  root   -
d       /usr/local/etc                                  0755  root  root   -
d       /usr/local/etc/universal-controller             0755  root  root   -
d       /usr/local/etc/universal-controller/mqtt        0700  hubd  hubd   -
Z       /usr/local/etc/universal-controller/mqtt        -     hubd  hubd   -
d       /usr/local/etc/universal-controller/tls         0700  hubd  hubd   -
Z       /usr/local/etc/universal-controller/tls         -     hubd  hubd   -
d       /usr/local/var/lib/universal-controller         0700  hubd  hubd   -
Z       /usr/local/var/lib/universal-controller         -     hubd  hubd   -
