# Enables the legacy fbdev compatibility layer on top of the working DRM/KMS
# driver (CONFIG_DRM_STM + CONFIG_DRM_PANEL_ORISETECH_OTM8009A, both already
# enabled and confirmed working against the DK2's onboard DSI panel) -- off
# by default in this kernel build, which meant /dev/fb0 didn't exist even
# though the actual display driver was working fine.
#
# Needed for linux_a7/ui_layer (issue #14): Slint's software renderer writes
# directly to /dev/fb0, matching that issue's own DoD wording ("Slint GUI
# over /dev/fb0"), rather than going through Slint's alternate DRM-dumb-
# buffer backend (which would need no kernel change, but pulls in ~70 extra
# crates plus native libinput/libseat/libdrm-dev dependencies for automatic
# touch handling -- more than this project needs for one button).
CONFIG_DRM_FBDEV_EMULATION=y
