# The hub's firewall (issue #37, recipes-connectivity/hub-firewall) is an
# nftables ruleset for the "inet" family: ONE table that covers IPv4 and
# IPv6 alike, so an IPv6 path can't be forgotten. ST's kernel config has
# nftables itself (CONFIG_NF_TABLES=m, conntrack, reject, limit, log -- all
# already there), but none of its address families, so no table could be
# created at all. These are parts of the nf_tables module (not separate
# modules), so they become available whenever it loads.
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
