# Heartbeat needs both console output (printk) and the LED (gpio.h) driver;
# printk isn't guaranteed on by the board defconfig, GPIO already is.
CONFIG_PRINTK=y

# RPMsg link to backend_daemon (issue #12), over OpenAMP's low-level API -
# the same one Zephyr's own openamp_rsc_table sample uses, since that's the
# only sample with board files proven for this exact board (Zephyr's newer
# high-level ipc_service API has no stm32mp157c_dk2 board support to build
# on). CONFIG_OPENAMP_MASTER=n: the M4 is the RPMsg *remote* here, Linux is
# the master that owns/creates the vrings - this is fixed by the AMP
# topology, not a preference.
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
