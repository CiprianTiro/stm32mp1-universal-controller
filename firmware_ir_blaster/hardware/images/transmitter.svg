<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Transmitter schematic" width="720" height="430"><style>
text{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#1d2320}
.lbl{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:14px}
.sm{font-size:12px;fill:#5d6862}
.w{stroke:#2b322e;stroke-width:2.2;fill:none}
.v5{stroke:#c8322b;stroke-width:3;fill:none}.v33{stroke:#d47a12;stroke-width:3;fill:none}
.gnd{stroke:#3a4a8c;stroke-width:3;fill:none}.sig{stroke:#1f8a4c;stroke-width:3;fill:none}
.ir{stroke:#8a3fc2;stroke-width:2;fill:none}
.res,.body{fill:#ffffff;stroke:#2b322e;stroke-width:2.2}
.solid,.dot{fill:#2b322e;stroke:none}
.t5{fill:#c8322b}.t33{fill:#d47a12}.tg{fill:#3a4a8c}.ts{fill:#1f8a4c}
</style><rect width="100%%" height="100%%" fill="#ffffff"/>
        <!-- 5V rail -->
        <path class="v5" d="M40 50 H640"/>
        <text x="40" y="38" class="lbl t5">5Vin pin (IN-OUT bridged)</text>

        <!-- R1: two 47 ohm in parallel -->
        <path class="w" d="M320 50 V64"/>
        <rect class="res" x="306" y="64" width="28" height="44" rx="3"/>
        <text x="345" y="82" class="lbl">R1 2 × 47Ω side by side</text>
        <text x="345" y="100" class="sm">(in parallel ≈ 23Ω)</text>
        <path class="w" d="M320 108 V120"/>

        <!-- LED1 + LED2 in series: anode top, cathode bottom -->
        <polygon class="body" points="302,120 338,120 320,146"/>
        <path class="w" d="M302 146 H338"/>
        <path class="w" d="M320 146 V162"/>
        <polygon class="body" points="302,162 338,162 320,188"/>
        <path class="w" d="M302 188 H338"/>
        <path class="w" d="M320 188 V238"/>
        <text x="345" y="138" class="lbl">IR LED 1</text>
        <text x="345" y="180" class="lbl">IR LED 2</text>
        <text x="425" y="138" class="sm">long leg (+) up,</text>
        <text x="425" y="156" class="sm">short (−) down</text>
        <text x="425" y="180" class="sm">both point the</text>
        <text x="425" y="198" class="sm">same way</text>
        <!-- IR arrows -->
        <path class="ir" d="M290 128 L268 118 M274 116 L268 118 L272 124"/>
        <path class="ir" d="M290 170 L268 160 M274 158 L268 160 L272 166"/>

        <!-- Q1 NPN -->
        <circle cx="310" cy="270" r="30" class="body" style="fill:none"/>
        <path class="w" d="M296 250 V290"/>
        <path class="w" d="M320 238 L320 244 L296 260"/>
        <path class="w" d="M296 280 L320 296 L320 380"/>
        <polygon class="solid" points="320,296 306,293 313,284"/>
        <text x="326" y="250" class="sm">C</text>
        <text x="326" y="300" class="sm">E</text>
        <text x="282" y="262" class="sm">B</text>
        <text x="350" y="266" class="lbl">Q1 2N2222</text>
        <text x="350" y="284" class="sm">NPN transistor</text>

        <!-- base network -->
        <path class="sig" d="M40 270 H110"/>
        <text x="40" y="258" class="lbl ts">GPIO4</text>
        <rect class="res" x="110" y="258" width="64" height="24" rx="3"/>
        <text x="112" y="304" class="lbl">R2 1kΩ</text>
        <path class="w" d="M174 270 H296"/>
        <circle cx="230" cy="270" r="4.5" class="dot"/>
        <path class="w" d="M230 270 V300"/>
        <rect class="res" x="218" y="300" width="24" height="52" rx="3"/>
        <text x="160" y="332" class="lbl">R3 10kΩ</text>
        <path class="w" d="M230 352 V380"/>

        <!-- C1 electrolytic -->
        <circle cx="570" cy="50" r="4.5" class="dot"/>
        <path class="w" d="M570 50 V200"/>
        <path class="w" d="M550 200 H590"/>
        <path class="w" d="M550 216 Q570 206 590 216"/>
        <path class="w" d="M570 211 V380"/>
        <text x="538" y="196" class="lbl">+</text>
        <text x="598" y="200" class="lbl">C1 100µF</text>
        <text x="598" y="218" class="sm">stripe (−)</text>
        <text x="598" y="234" class="sm">to GND</text>

        <!-- GND rail -->
        <path class="gnd" d="M40 380 H640"/>
        <circle cx="230" cy="380" r="4.5" class="dot"/>
        <circle cx="320" cy="380" r="4.5" class="dot"/>
        <circle cx="570" cy="380" r="4.5" class="dot"/>
        <text x="40" y="404" class="lbl tg">GND pin</text>
        <text x="330" y="404" class="sm">all grounds meet here</text>
      </svg>