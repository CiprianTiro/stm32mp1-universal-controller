# Development MQTT broker, set up to behave like AWS IoT Core where it
# matters for the board's code: TLS only, every client must present a
# certificate signed by our CA, and each device may only touch its own
# topics. See README.md.

# Keep retained messages (e.g. the last "desired" state) across broker
# restarts, like a cloud broker would.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# No plaintext listener at all -- only TLS on the standard secure MQTT port.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Mutual TLS: reject any client without a certificate signed by ca.crt.
require_certificate true
# ...and treat the certificate's Common Name as the client's username, so
# the ACL below can refer to "whoever this certificate says you are". This
# is the same trust model as AWS IoT: identity comes from the certificate,
# there is no password.
use_identity_as_username true

acl_file /mosquitto/config/acl
